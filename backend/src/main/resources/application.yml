server:
  # Railway 등 PaaS는 컨테이너가 PORT 환경변수로 지정된 포트를 리슨하길 기대한다.
  port: ${PORT:8080}
  # Cloudflare Tunnel(cloudflared)이 X-Forwarded-Proto/Host로 원래 요청 정보를 전달하는데,
  # 이걸 신뢰하지 않으면 OAuth2 redirect-uri의 {baseUrl}이 내부 주소(http://backend:8080)로
  # 잘못 만들어져서 구글/네이버 콘솔에 등록한 https 주소와 안 맞아 로그인이 계속 실패한다.
  forward-headers-strategy: framework
  error:
    # 기본값(never)이면 ResponseStatusException의 reason(예: 도서관 로그인 실패 사유)이 응답 body에서
    # 빠져서 프론트가 일반 문구만 보게 된다 — 우리가 직접 작성한 사용자용 메시지라 노출해도 안전하다.
    include-message: always

spring:
  application:
    name: woori-library
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/woori_library}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH_GOOGLE_CLIENT_ID:}
            client-secret: ${OAUTH_GOOGLE_CLIENT_SECRET:}
            scope: profile, email
          naver:
            client-id: ${OAUTH_NAVER_CLIENT_ID:}
            client-secret: ${OAUTH_NAVER_CLIENT_SECRET:}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            client-name: Naver
            scope: name, email
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

app:
  frontend:
    # OAuth 로그인 성공 리다이렉트 + CORS 허용 origin. 배포 환경에서는 실제 프론트 도메인(https)으로 설정.
    base-url: ${APP_FRONTEND_BASE_URL:http://localhost:5173}
  crypto:
    library-password-key: ${LIBRARY_PW_ENC_KEY:}
  crawler:
    issl:
      base-url: https://www.issl.go.kr
      user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"
  push:
    vapid:
      public-key: ${VAPID_PUBLIC_KEY:}
      private-key: ${VAPID_PRIVATE_KEY:}
      subject: ${VAPID_SUBJECT:}
    # 매일 이 시각에 전체 계정을 돌며 issl.go.kr 동기화 + 반납임박/연체 푸시 발송(PushNotificationScheduler).
    schedule:
      cron: "0 30 8 * * *"
