services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 호스트/외부에 절대 노출하지 않는다 — backend 컨테이너만 내부 네트워크로 접근.

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    # cloudflared가 내부 DNS(backend:8080)로 접근하므로 호스트 포트 노출 불필요.

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - backend
    # 아웃바운드로만 Cloudflare에 연결하므로 80/443 포트를 호스트에 열 필요가 없다.
    # Public Hostname → Service 매핑은 Cloudflare 대시보드에서 backend:8080으로 설정한다.

volumes:
  postgres_data:
